services:
  backend:
    image: playsmartbuas/bg-app-backend
    container_name: app-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/bget.db:/app/bget.db
      - ./backend/logs:/app/logs
      - ${ESPORTS_DIR}:/mnt/raid0/esports
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_HOURS=24
      - DATABASE_URL=sqlite:///./bget.db
      - RIOT_API_KEY=${RIOT_API_KEY}
      - HENRIK_API_KEY=${HENRIK_API_KEY}
      - CORS_ORIGINS=*
      - ENVIRONMENT=${ENVIRONMENT:-production}
    restart: unless-stopped

  frontend:
    image: playsmartbuas/bg-app-frontend
    container_name: app-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

  pipeline:
    image: playsmartbuas/bg-app-pipeline
    container_name: app-pipeline
    volumes:
      - ${ESPORTS_DIR}:/mnt/raid0/esports
    environment:
      - TZ=Europe/Amsterdam
    restart: unless-stopped

  inference:
    image: playsmartbuas/bg-app-inference
    container_name: app-inference
    ports:
      - "8001:8001"
    volumes:
      - ${ESPORTS_DIR}:/mnt/raid0/esports
    environment:
      - TZ=Europe/Amsterdam
      - GPU_PC_URL=${GPU_PC_URL}
      - WATCH_FOLDER=/mnt/raid0/esports/sftp_data/merged
      - VIDEO_FOLDER=/mnt/raid0/esports/sftp_data/video
      - RESULTS_FOLDER=/mnt/raid0/esports/sftp_data/results
    restart: unless-stopped

  sftp:
    image: atmoz/sftp
    container_name: app-sftp-container
    ports:
      - "2422:22"
    volumes:
      - ${ESPORTS_DIR}/sftp_data:/home/localhost/data
    environment:
      - SFTP_USERS=localhost:${SFTP_PASSWORD}:1234
    command: >
      /bin/sh -c "mkdir -p /home/localhost/data/emotion /home/localhost/data/video
      /home/localhost/data/input /home/localhost/data/merged /home/localhost/data/gaze
      /home/localhost/data/eda /home/localhost/data/audio;
      chown -R 1234:100 /home/localhost/data || true;
      chmod -R 775 /home/localhost/data || true;
      exec /usr/sbin/sshd -D"
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-latest}
    container_name: app-seaweedfs
    command: >
      server -dir=/data -filer -s3
      -ip=seaweedfs -ip.bind=0.0.0.0
      -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=${SEAWEED_VOLUME_MB:-1024}
    ports:
      - "127.0.0.1:9333:9333"
      - "127.0.0.1:8888:8888"
      - "8333:8333"
    volumes:
      - ${SEAWEEDFS_DIR}:/data
      - ./seaweedfs/config/s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped

  seaweed-sftp:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-latest}
    container_name: app-seaweed-sftp
    command: >
      sftp -filer=seaweedfs:8888 -port=2022
      -userStoreFile=/etc/seaweedfs/users.json
      -sshPrivateKey=/etc/seaweedfs/ssh_host_key
    ports:
      - "2022:2022"
    volumes:
      - ./seaweedfs/config/users.json:/etc/seaweedfs/users.json:ro
      - ./seaweedfs/config/ssh_host_key:/etc/seaweedfs/ssh_host_key:ro
    depends_on:
      - seaweedfs
    restart: unless-stopped